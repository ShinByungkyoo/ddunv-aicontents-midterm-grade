<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>중간고사 성적 조회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f5f4f9;
    --card: #ffffff;
    --text: #1d1b26;
    --muted: #625d75;
    --line: #e1dded;
    --accent: #5b3fd6;
    --accent-soft: #efebff;
    --error: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13111a; --card: #1c1926; --text: #ece9f6; --muted: #a49eba; --line: #2f2b3e;
      --accent: #a28bff; --accent-soft: #272040; --error: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Pretendard, system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 16px 64px; }
  .course { color: var(--muted); font-size: 14px; }
  h1 { font-size: 28px; margin: 4px 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 0 0 6px; }
  .field { margin-bottom: 16px; }
  input, select { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  button { width: 100%; font: inherit; font-weight: 700; color: #fff; background: var(--accent); border: none; border-radius: 10px; padding: 12px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--error); font-size: 14px; margin: 12px 0 0; min-height: 1em; }
  .result { margin-top: 20px; }
  .score { display: flex; align-items: baseline; gap: 8px; margin: 4px 0 20px; }
  .score b { font-size: 44px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .score span { color: var(--muted); }
  .result h2 { font-size: 16px; margin: 0; color: var(--muted); font-weight: 600; }
  .comment { white-space: pre-wrap; background: var(--accent-soft); border-radius: 12px; padding: 16px; font-size: 15px; margin-top: 8px; word-break: keep-all; overflow-wrap: anywhere; }
  .who { font-size: 18px; font-weight: 700; }
  .again { margin-top: 20px; background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .foot { color: var(--muted); font-size: 13px; margin-top: 20px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="course">동덕여자대학교 2026-2 AI콘텐츠제작</div>
  <h1>중간고사 성적 조회</h1>

  <form class="card" id="form" autocomplete="off">
    <div class="field">
      <label for="section">분반</label>
      <select id="section" required>
        <option value="1">1분반</option>
        <option value="2">2분반</option>
      </select>
    </div>
    <div class="field">
      <label for="sid">학번</label>
      <input id="sid" inputmode="text" placeholder="예: U20260001" required>
      <div class="hint">영문자 U는 빼고 숫자만 입력해도 됩니다.</div>
    </div>
    <div class="field">
      <label for="name">이름</label>
      <input id="name" placeholder="예: 홍길동" required>
    </div>
    <button type="submit" id="submit">조회하기</button>
    <p class="error" id="error" role="alert"></p>
  </form>

  <div class="card result" id="result" hidden>
    <div class="who" id="who"></div>
    <div class="score"><b id="score"></b><span>/ 30점</span></div>
    <h2>평가 의견</h2>
    <div class="comment" id="comment"></div>
    <button type="button" class="again" id="again">다른 학생으로 조회</button>
  </div>

  <p class="foot">본인의 성적만 조회할 수 있습니다. 성적 문의는 담당 교수에게 해 주세요.</p>
</div>

  // 성적 파일을 만들 때와 같은 규칙: 학번은 숫자만, 이름은 공백 제거
  function normalize(section, sid, name) {
    return `${section}|${sid.replace(/\D/g, '')}|${name.replace(/\s+/g, '').normalize('NFC')}`;
  }

  async function lookup(section, sid, name) {
    const sec = DATA.sections[section];
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(normalize(section, sid, name)), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(sec.salt), iterations: DATA.iter }, base, 512));
    const id = toHex(bits.slice(32, 48));
    const rec = sec.records.find(r => r.id === id);
    if (!rec) return null;
    const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(rec.iv) }, key, fromB64(rec.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    $('error').textContent = '';
    $('submit').disabled = true;
    $('submit').textContent = '조회 중…';
    try {
      const r = await lookup($('section').value, $('sid').value, $('name').value);
      if (!r) {
        $('error').textContent = '일치하는 정보가 없습니다. 분반, 학번, 이름을 다시 확인해 주세요.';
        return;
      }
      $('who').textContent = `${r.name} 님`;
      $('score').textContent = Number(r.score).toFixed(2).replace(/\.?0+$/, '');
      $('comment').textContent = r.comment;
      $('form').hidden = true;
      $('result').hidden = false;
    } catch (err) {
      $('error').textContent = '조회 중 문제가 생겼습니다. 최신 브라우저에서 다시 시도해 주세요.';
    } finally {
      $('submit').disabled = false;
      $('submit').textContent = '조회하기';
    }
  });

  $('again').addEventListener('click', () => {
    $('sid').value = '';
    $('name').value = '';
    $('result').hidden = true;
    $('form').hidden = false;
  });
</script>
</body>
</html>
